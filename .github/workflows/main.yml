name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Lua-Alves
          outputs: |
            outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ffffff&color_dots=%230d0d0d,%232a1838,%236d28d9,%23c084fc,%23ffffff
            dist/github-contribution-grid-snake.gif?color_snake=%23ffffff&color_dots=%230d0d0d,%232a1838,%236d28d9,%23c084fc,%23ffffff&color_background=%23000000

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
